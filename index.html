<body>

  <header>
    <h1>Toto's Wild- u. Honigspezialitäten</h1>
  </header>

  <main class="wrapper">
    <div id="loader" class="loader"></div>
    <div id="product-container"></div>
  </main>

  <script>
    const timestamp = new Date().getTime();

    const styles = [
      "base/general.css",
      "products/products.css",
      "overlays/overlays.css",
      "footer/footer.css",
    ];

    styles.forEach(style => {
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = style + "?v=" + timestamp;
      document.head.appendChild(link);
    });

    const footerScript = document.createElement("script");
    footerScript.src = "footer/footer.js?v=" + timestamp;
    document.body.appendChild(footerScript);
    footerScript.onload = () => insertFooter(true);

    const modules = [
      "base/main.js",
      "products/productApi.js",
      "products/productCard.js",
      "products/productCombiner.js",
      "products/productPage.js",
      "products/productRepository.js",
      "overlays/overlay.js",
    ];

    modules.forEach(module => {
      const script = document.createElement("script");
      script.type = "module";
      script.src = module + "?v=" + timestamp;
      document.body.appendChild(script);
    });
  </script>

</body>
